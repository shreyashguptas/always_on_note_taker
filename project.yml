name: EchoNotes

options:
  bundleIdPrefix: com.shreyashg
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

# Pinned exactly: both SDKs are young and have had API churn (WhisperKit's
# repo rename, FluidAudio's Swift 6 rewrite). Upgrades should be deliberate —
# bump the pin, re-run the enrichment smoke tests in TESTING.md.
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "1.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.12.4"

targets:
  EchoNotes:
    type: application
    platform: iOS
    sources:
      - EchoNotes
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyashg.echonotes
        PRODUCT_NAME: EchoNotes
        # Versioning contract: every PR to main bumps MARKETING_VERSION
        # (minor for features, patch for fixes) and increments
        # CURRENT_PROJECT_VERSION. Settings → About shows this next to the
        # build's git commit.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EchoNotes/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        # The git-commit script below writes into the built product.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Git Commit
        basedOnDependencyAnalysis: false
        script: |
          # Stamp the built Info.plist with the source commit so Settings →
          # About can link the running build to its exact code on GitHub.
          # Runs before code signing (script phases precede signing), so the
          # signature covers the stamped value. Falls back to "dev" when git
          # isn't available (e.g. building from an exported source archive).
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          COMMIT=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo dev)
          if [ -f "${PLIST}" ]; then
            /usr/libexec/PlistBuddy -c "Set :GitCommit ${COMMIT}" "${PLIST}" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :GitCommit string ${COMMIT}" "${PLIST}"
          fi

  EchoNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EchoNotesTests
    dependencies:
      - target: EchoNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shreyashg.echonotes.tests
        GENERATE_INFOPLIST_FILE: YES
